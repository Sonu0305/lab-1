<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator - Dart DOM App</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script defer src="main.dart.js"></script>
</head>
<body>
    <div class="calculator-card">
        <h1>Tip Calculator</h1>
        <p class="subtitle">Calculate tips quickly and easily</p>
        
        <div class="input-group">
            <label for="bill-amount">Bill Amount ($):</label>
            <input type="number" id="bill-amount" placeholder="0.00" min="0" step="0.01">
        </div>

        <div class="input-group">
            <label for="tip-percentage">Tip Percentage (%):</label>
            <input type="number" id="tip-percentage" placeholder="15" min="0" step="1">
        </div>

        <button id="calculate-btn">Calculate Tip</button>

        <div id="output-section" class="output-card hidden">
            <h2>Results</h2>
            <div class="result-row">
                <span>Tip Amount:</span>
                <span class="value">$<span id="tip-amount">0.00</span></span>
            </div>
            <div class="result-row total">
                <span>Total Bill:</span>
                <span class="value">$<span id="total-bill">0.00</span></span>
            </div>
        </div>
    </div>
</body>
</html>
